[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taleport"
version = "1.1.0"
description = "TALeport: local trend scanner and post drafting assistant for social media managers"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pywebview>=5.1",
    "keyring>=25",
    "httpx>=0.27",
    "feedparser>=6.0",
    "apscheduler>=3.10,<4",
    "pystray>=0.19",
    "Pillow>=10",
    "yake>=0.4.8",
    "anthropic>=2.3",
    "pypdf>=4",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "matplotlib>=3.9",
    "svglib>=1.5",
    "python-multipart>=0.0.9",
    "imageio-ffmpeg>=0.5",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.11",
]

[project.scripts]
taleport = "taleport.main:main"

[tool.setuptools.packages.find]
include = ["taleport*"]

[tool.setuptools.package-data]
taleport = ["db/migrations/*.sql", "resources/**/*", "ai/prompt_templates/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
